<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Cek Hoax ID</title>
<style>
  :root {
    --paper: #fbfaf6; --white: #ffffff; --ink: #1a1a1a; --muted: #5f5c55; --rule: #d9d5c9;
    --red: #b3261e; --red-bg: #fbeceb;
    --green: #1e6b3c; --green-bg: #eaf4ed;
    --amber: #8a5a00; --amber-bg: #fbf1dc;
    --link: #17457a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 17px/1.6 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 36px 20px 64px; }
  header { border-bottom: 3px double var(--ink); padding-bottom: 16px; margin-bottom: 24px; }
  h1 { font: 700 2.3rem/1.1 Georgia, "Times New Roman", serif; margin: 0 0 6px; }
  .sub { margin: 0; color: var(--muted); font-size: .98rem; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 160px; padding: 12px; resize: vertical;
    font: inherit; color: var(--ink); background: var(--white);
    border: 1px solid #8f8b7f; border-radius: 2px;
  }
  textarea:focus-visible, button:focus-visible { outline: 3px solid #f2b705; outline-offset: 1px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; }
  .count { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .go {
    background: var(--ink); color: var(--white); border: 0; border-radius: 2px;
    padding: 10px 26px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .go:hover:not(:disabled) { background: #000; }
  .go:disabled { background: #a9a597; cursor: not-allowed; }
  .samples { margin: 14px 0 0; font-size: .9rem; color: var(--muted); }
  .samples button {
    background: none; border: 0; padding: 0; margin-left: 10px; font: inherit;
    color: var(--link); text-decoration: underline; cursor: pointer;
  }
  #result { margin-top: 26px; }
  .verdict { border: 2px solid; padding: 16px 18px; border-radius: 2px; }
  .verdict.hoax { color: var(--red); background: var(--red-bg); }
  .verdict.valid { color: var(--green); background: var(--green-bg); }
  .verdict.unsure { color: var(--amber); background: var(--amber-bg); }
  .verdict small { display: block; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
  .verdict h2 { font: 700 1.5rem/1.2 Georgia, serif; margin: 2px 0 6px; }
  .verdict p { margin: 0; color: var(--ink); font-size: .96rem; }
  .bar { position: relative; height: 12px; margin: 16px 0 6px; background: var(--white); border: 1px solid var(--ink); }
  .bar i { position: absolute; top: 0; bottom: 0; left: 0; background: currentColor; transition: width .4s ease-out; }
  .bar b { position: absolute; top: -4px; bottom: -4px; width: 1px; background: var(--ink); }
  .bar-label { display: flex; justify-content: space-between; font-size: .8rem; color: var(--ink); }
  .error { color: var(--red); margin: 0; }
  h3 { font: 700 1.1rem Georgia, serif; margin: 40px 0 6px; border-top: 1px solid var(--ink); padding-top: 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: .92rem; }
  li .pct { flex: none; width: 3.2em; font-weight: 700; font-variant-numeric: tabular-nums; }
  li .pct.hoax { color: var(--red); } li .pct.valid { color: var(--green); } li .pct.unsure { color: var(--amber); }
  li .t { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer { margin-top: 36px; font-size: .84rem; color: var(--muted); }
  footer a { color: var(--link); }
  @media (max-width: 480px) { h1 { font-size: 1.9rem; } }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Cek Hoax ID</h1>
    <p class="sub">Tempel isi pesan atau berita yang mencurigakan untuk pemeriksaan awal.</p>
  </header>

  <label for="text">Teks yang mau dicek</label>
  <textarea id="text" maxlength="5000"></textarea>
  <div class="row">
    <span class="count" id="count">0 / 5000</span>
    <button class="go" id="go" type="button" disabled>Periksa</button>
  </div>
  <p class="samples" id="samples">Contoh:
    <button type="button" data-t="Awas! Listrik akan padam total se-Jawa selama 3 hari besok, harap isi daya dan sebarkan ke semua grup">pesan berantai</button>
    <button type="button" data-t="Kartu ATM akan diblokir hari ini, kirim kode OTP ke nomor ini untuk verifikasi">minta kode OTP</button>
    <button type="button" data-t="Badan Pusat Statistik merilis data inflasi bulanan yang naik tipis dibanding bulan sebelumnya">berita biasa</button>
  </p>

  <div id="result" aria-live="polite"></div>

  <section id="history" hidden>
    <h3>Pemeriksaan terakhir</h3>
    <ul id="list"></ul>
  </section>

  <footer>
    <p id="info"></p>
    <p>Hasil ini hanya perkiraan dari pola bahasa, bukan pemeriksaan fakta. Sebelum menyebarkan sesuatu,
    cocokkan dengan <a href="https://turnbackhoax.id" target="_blank" rel="noopener">turnbackhoax.id</a>
    atau media yang kredibel.</p>
  </footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const text = $("text"), go = $("go");
const HOAX_AT = 0.65, VALID_AT = 0.35;

function verdictOf(p) {
  if (p >= HOAX_AT) return { key: "hoax", label: "Hasil pemeriksaan", title: "Kemungkinan besar hoaks", note: "Pola bahasanya mirip hoaks yang pernah beredar. Jangan disebarkan sebelum ada sumber resmi." };
  if (p <= VALID_AT) return { key: "valid", label: "Hasil pemeriksaan", title: "Kemungkinan besar bukan hoaks", note: "Pola bahasanya lebih mirip berita biasa. Sumbernya tetap perlu dicek." };
  return { key: "unsure", label: "Hasil pemeriksaan", title: "Belum bisa dipastikan", note: "Ciri-cirinya campuran. Cari sumber resmi sebelum percaya atau menyebarkan." };
}

const store = (fn) => { try { return fn(localStorage); } catch { return null; } };
const loadHistory = () => { try { return JSON.parse(store(s => s.getItem("history")) || "[]"); } catch { return []; } };
function saveHistory(item) {
  const h = [item, ...loadHistory()].slice(0, 5);
  store(s => s.setItem("history", JSON.stringify(h)));
  renderHistory(h);
}
function renderHistory(h = loadHistory()) {
  $("history").hidden = h.length === 0;
  $("list").replaceChildren(...h.map(x => {
    const li = document.createElement("li");
    const pct = document.createElement("span");
    pct.className = "pct " + x.key; pct.textContent = Math.round(x.p * 100) + "%";
    const t = document.createElement("span");
    t.className = "t"; t.textContent = x.text;
    li.append(pct, t);
    return li;
  }));
}

function showResult(p) {
  const v = verdictOf(p), pct = Math.round(p * 100);
  const box = $("result");
  box.innerHTML = `
    <div class="verdict ${v.key}">
      <small></small><h2></h2><p></p>
      <div class="bar" role="img" aria-label="Kemiripan dengan hoaks ${pct} persen">
        <i style="width:0"></i><b style="left:${VALID_AT * 100}%"></b><b style="left:${HOAX_AT * 100}%"></b>
      </div>
      <div class="bar-label"><span>0% (tidak mirip)</span><span>${pct}% mirip hoaks</span><span>100%</span></div>
    </div>`;
  box.querySelector("small").textContent = v.label;
  box.querySelector("h2").textContent = v.title;
  box.querySelector("p").textContent = v.note;
  requestAnimationFrame(() => { box.querySelector("i").style.width = pct + "%"; });
  return v;
}

async function check() {
  const value = text.value.trim();
  go.disabled = true; go.textContent = "Memeriksa...";
  try {
    const res = await fetch("/predict", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: value }) });
    if (!res.ok) throw new Error(res.status === 503 ? "Model belum siap. Latih modelnya dulu." : "Pemeriksaan gagal (kode " + res.status + ").");
    const { hoax_probability: p } = await res.json();
    saveHistory({ text: value, p, key: showResult(p).key });
  } catch (e) {
    $("result").innerHTML = '<p class="error"></p>';
    $("result").firstChild.textContent = e.message;
  } finally {
    go.textContent = "Periksa"; sync();
  }
}

function sync() {
  $("count").textContent = text.value.length + " / 5000";
  go.disabled = text.value.trim().length < 3;
}
text.addEventListener("input", sync);
text.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && !go.disabled) check(); });
go.addEventListener("click", check);
$("samples").addEventListener("click", e => {
  const t = e.target.dataset && e.target.dataset.t;
  if (t) { text.value = t; sync(); text.focus(); }
});

fetch("/model-info").then(r => r.json()).then(m => {
  if (m.n_train) $("info").textContent = `Dilatih dari ${m.n_train + m.n_test} contoh teks. Data bertambah otomatis dari RSS TurnBackHoax dan Antara.`;
}).catch(() => {});

sync(); renderHistory();
</script>
</body>
</html>
