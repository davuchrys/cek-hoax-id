name: Update dataset and retrain
on:
  schedule:
    - cron: "0 2 * * 1"   # every Monday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Restore corpus from previous runs
        uses: actions/cache@v4
        with:
          path: data/corpus.csv
          key: corpus-${{ github.run_id }}
          restore-keys: corpus-
      - name: Fetch new items from RSS feeds
        run: PYTHONPATH=src python -m hoax_detector.data_update fetch
      - name: Retrain
        run: PYTHONPATH=src python -m hoax_detector.train --data data/corpus.csv --out models/model.joblib
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            models/model.joblib
            models/metrics.json
